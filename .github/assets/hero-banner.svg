<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="FreeNotch — Dynamic Island for Windows 11">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="55%" stop-color="#0E1730"/>
      <stop offset="100%" stop-color="#140D2A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="22%" r="58%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#2563EB" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#070B16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2822A8"/>
      <stop offset="55%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="960" height="280" rx="22" fill="url(#bg)"/>
  <rect width="960" height="280" rx="22" fill="url(#glow)"/>

  <!-- Docked Notch silhouette with concave top ears -->
  <g filter="url(#shadow)">
    <path d="M 248,0 A 14,14 0 0 1 262,14 L 262,102 A 22,22 0 0 0 284,124 L 676,124 A 22,22 0 0 0 698,102 L 698,14 A 14,14 0 0 1 712,0 Z" fill="#000000"/>
  </g>

  <!-- Mini Top Tab Icons inside the Notch -->
  <g transform="translate(302, 18)" stroke="#F0F0F5" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <rect x="0" y="0" width="26" height="26" rx="13" fill="#1E1E24" stroke="none"/>
    <path d="M 7,7 L 11,7 L 11,11 L 7,11 Z M 7,14 L 11,14 L 11,18 L 7,18 Z M 14,14 L 18,14 L 18,18 L 14,18 Z M 16.5,5.5 L 19.5,8.5 L 16.5,11.5 L 13.5,8.5 Z" stroke="#FFFFFF"/>
    <path d="M 38,9 L 40,6 L 48,6 L 50,9 L 50,18 A 1.5,1.5 0 0 1 48.5,19.5 L 39.5,19.5 A 1.5,1.5 0 0 1 38,18 Z" opacity="0.72"/>
    <path d="M 68,16 A 2,2 0 1 1 64,16 A 2,2 0 1 1 68,16 Z M 76,14.5 A 2,2 0 1 1 72,14.5 A 2,2 0 1 1 76,14.5 Z M 68,16 L 68,7.5 L 76,6 L 76,14.5" opacity="0.72"/>
    <path d="M 98,10 A 4.5,4.5 0 0 0 90,10 C 90,14 88,15.5 88,15.5 L 100,15.5 C 100,15.5 98,14 98,10 Z" fill="#F0F0F5" stroke="none" opacity="0.72"/>
    <path d="M 118,5 L 112,13 L 117,13 L 116,19 L 122,11 L 117,11 Z" opacity="0.72"/>
    <path d="M 140,14.5 L 148,14.5 A 3,3 0 0 0 148.5,8.5 A 3.8,3.8 0 0 0 141,7.5 A 3.2,3.2 0 0 0 140,14.5 Z" opacity="0.72"/>
  </g>

  <!-- Privacy Green Dot inside Notch -->
  <circle cx="672" cy="22" r="3.5" fill="#30D158"/>

  <!-- Two Bento Preview Cards inside Notch -->
  <rect x="284" y="54" width="190" height="54" rx="14" fill="#111114" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="296" y="65" width="32" height="32" rx="9" fill="url(#accent)"/>
  <text x="338" y="79" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Midnight Horizon</text>
  <rect x="338" y="88" width="120" height="5" rx="2.5" fill="#2A2A34"/>
  <rect x="338" y="88" width="76" height="5" rx="2.5" fill="url(#accent)"/>

  <rect x="486" y="54" width="190" height="54" rx="14" fill="#111114" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <text x="502" y="77" fill="#8E8E93" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="600">WEATHER · BERLIN</text>
  <text x="502" y="97" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">14° · Light Rain</text>
  <g transform="translate(636, 69)" fill="#8B5CF6">
    <rect x="0" y="9" width="3" height="11" rx="1.5"/>
    <rect x="6" y="3" width="3" height="17" rx="1.5"/>
    <rect x="12" y="6" width="3" height="14" rx="1.5"/>
    <rect x="18" y="10" width="3" height="10" rx="1.5"/>
  </g>

  <!-- Hero Title & Tagline -->
  <text x="480" y="186" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.8">FreeNotch</text>
  <text x="480" y="216" text-anchor="middle" fill="#C4C9D4" font-family="Segoe UI, system-ui, sans-serif" font-size="15.5" font-weight="500">Dynamic Island for Windows 11 · Local-First · Open Source (GPLv3)</text>
  <text x="480" y="244" text-anchor="middle" fill="#8E96A8" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5">2×2 Bento Widgets · Synced Lyrics · File Tray · Clipboard · Quick Actions · Weather</text>
</svg>
