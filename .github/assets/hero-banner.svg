<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="FreeNotch — Dynamic Island for Windows 11">
  <defs>
    <!-- Windows 11 deep navy bloom background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061024"/>
      <stop offset="55%" stop-color="#0A1936"/>
      <stop offset="100%" stop-color="#050D1E"/>
    </linearGradient>
    <radialGradient id="bloomLeft" cx="24%" cy="72%" r="48%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#0F2A6B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#061024" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomRight" cx="76%" cy="55%" r="46%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#1E3A8A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#061024" stop-opacity="0"/>
    </radialGradient>

    <!-- Album-tinted & weather tile gradients matching real UI -->
    <linearGradient id="lyricsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171216"/>
      <stop offset="55%" stop-color="#281622"/>
      <stop offset="100%" stop-color="#161114"/>
    </linearGradient>
    <linearGradient id="mediaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1217"/>
      <stop offset="100%" stop-color="#151013"/>
    </linearGradient>
    <linearGradient id="weatherBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1D22"/>
      <stop offset="55%" stop-color="#2D333B"/>
      <stop offset="100%" stop-color="#181A1F"/>
    </linearGradient>
    <linearGradient id="albumArt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#BE185D"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <filter id="shadow" x="-15%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="340" rx="22" fill="url(#bg)"/>
  <rect width="960" height="340" rx="22" fill="url(#bloomLeft)"/>
  <rect width="960" height="340" rx="22" fill="url(#bloomRight)"/>

  <!-- Real Docked Notch Shell (OLED #000000, concave top ears, 20px bottom radius) -->
  <g filter="url(#shadow)">
    <path d="M 226,0 A 14,14 0 0 1 240,14 L 240,180 A 20,20 0 0 0 260,200 L 700,200 A 20,20 0 0 0 720,180 L 720,14 A 14,14 0 0 1 734,0 Z" fill="#000000"/>
  </g>

  <!-- Top Header Tab Bar (matching screenshot icon row) -->
  <g transform="translate(255, 11)" stroke="#E4E4E7" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Active Bento Grid pill -->
    <circle cx="11" cy="11" r="11" fill="#27272A" stroke="none"/>
    <rect x="6.5" y="6.5" width="3.5" height="3.5" rx="0.6" stroke="#FFFFFF"/>
    <rect x="12" y="6.5" width="3.5" height="3.5" rx="0.6" stroke="#FFFFFF"/>
    <rect x="6.5" y="12" width="3.5" height="3.5" rx="0.6" stroke="#FFFFFF"/>
    <rect x="12" y="12" width="3.5" height="3.5" rx="0.6" stroke="#FFFFFF"/>

    <!-- Lightning (Control Center) -->
    <path d="M 35,5 L 30.5,11.5 L 34.5,11.5 L 33.5,17 L 38,10.5 L 34,10.5 Z" opacity="0.82"/>
    <!-- Bell (Notifications) -->
    <path d="M 55,14.5 H 49.5 C 50.5,13.5 50.8,12 50.8,10.2 A 2.7,2.7 0 0 1 56.2,10.2 C 56.2,12 56.5,13.5 57.5,14.5 H 55 Z M 52.3,16 A 1.3,1.3 0 0 0 54.7,16" opacity="0.82"/>
    <!-- File Tray -->
    <path d="M 69,7.5 H 77 V 15.5 H 69 Z M 69,10.5 H 71.5 L 72.3,11.8 H 73.7 L 74.5,10.5 H 77" opacity="0.82"/>
    <!-- Downloads -->
    <path d="M 91,6.5 V 13 M 88.5,10.5 L 91,13 L 93.5,10.5 M 87.5,15.5 H 94.5" opacity="0.82"/>
    <!-- Screen OCR -->
    <path d="M 106,8.5 V 6.5 H 108 M 112,6.5 H 114 V 8.5 M 114,13.5 V 15.5 H 112 M 108,15.5 H 106 V 13.5 M 108.5,11 H 111.5" opacity="0.82"/>
    <!-- Notes -->
    <path d="M 125.5,6.5 H 131.5 V 15.5 H 125.5 Z M 127.3,9.5 H 129.7 M 127.3,12 H 129.7" opacity="0.82"/>
    <!-- Screen Capture -->
    <circle cx="147" cy="11" r="4.2" opacity="0.82"/>
    <circle cx="147" cy="11" r="1.5" fill="#E4E4E7" stroke="none" opacity="0.82"/>
    <!-- Phone Transfer -->
    <rect x="163" y="6.2" width="6" height="9.6" rx="1.2" opacity="0.82"/>
    <!-- Weather -->
    <path d="M 181,14.5 H 187.5 A 2.2,2.2 0 0 0 187.8,10.2 A 3,3 0 0 0 182,9.5 A 2.5,2.5 0 0 0 181,14.5 Z" opacity="0.82"/>
    <!-- Finance -->
    <path d="M 199,14 L 202,10.5 L 204.2,12.2 L 207.5,8" opacity="0.82"/>

    <!-- Right-side Power & Settings -->
    <path d="M 418,7 V 10.5 M 415.4,8.2 A 4,4 0 1 0 420.6,8.2" opacity="0.82"/>
    <circle cx="439" cy="11" r="2.2" opacity="0.82"/>
    <circle cx="439" cy="11" r="4.3" stroke-dasharray="1.6 1.8" opacity="0.82"/>
  </g>

  <!-- 2x2 Bento Dashboard -->
  <!-- Tile 1 (Top-Left): Synced Lyrics -->
  <rect x="254" y="42" width="221" height="68" rx="13" fill="url(#lyricsBg)" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <rect x="265" y="51" width="18" height="18" rx="4" fill="url(#albumArt)"/>
  <text x="290" y="59" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" font-weight="700">No Lie</text>
  <text x="290" y="68" fill="#A1A1AA" font-family="Segoe UI, system-ui, sans-serif" font-size="7">Sean Paul</text>
  <text x="265" y="82" fill="#71717A" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600">No lie</text>
  <text x="265" y="93" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" font-weight="700">Same suh wi do it <tspan fill="#71717A" font-weight="600">(no lie)</tspan></text>
  <text x="265" y="103" fill="#71717A" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600">Suh wi set to it (no lie)</text>

  <!-- Tile 2 (Top-Right): Media Player -->
  <rect x="485" y="42" width="221" height="68" rx="13" fill="url(#mediaBg)" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <rect x="496" y="50" width="22" height="22" rx="5" fill="url(#albumArt)"/>
  <text x="525" y="59" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" font-weight="700">No Lie</text>
  <text x="525" y="69" fill="#A1A1AA" font-family="Segoe UI, system-ui, sans-serif" font-size="7">Sean Paul</text>
  <!-- Mini spectrum bars -->
  <g transform="translate(682, 52)" fill="#F9A8D4" opacity="0.75">
    <rect x="0" y="5" width="1.8" height="5" rx="0.9"/>
    <rect x="3.5" y="1" width="1.8" height="9" rx="0.9"/>
    <rect x="7" y="3" width="1.8" height="7" rx="0.9"/>
    <rect x="10.5" y="6" width="1.8" height="4" rx="0.9"/>
  </g>
  <!-- Media Controls -->
  <path d="M 571,80 V 86 M 577,80 L 572,83 L 577,86 Z" fill="#E4E4E7"/>
  <circle cx="595.5" cy="83" r="9.5" fill="#FFFFFF"/>
  <rect x="592.3" y="79.2" width="2.2" height="7.6" rx="0.8" fill="#000000"/>
  <rect x="596.5" y="79.2" width="2.2" height="7.6" rx="0.8" fill="#000000"/>
  <path d="M 614,80 L 619,83 L 614,86 Z M 620,80 V 86" fill="#E4E4E7"/>
  <!-- Timeline -->
  <rect x="496" y="99" width="199" height="2.6" rx="1.3" fill="#3F2B34"/>
  <rect x="496" y="99" width="182" height="2.6" rx="1.3" fill="#FBCFE8" opacity="0.7"/>
  <circle cx="678" cy="100.3" r="2.6" fill="#FFFFFF"/>

  <!-- Tile 3 (Bottom-Left): Finance -->
  <rect x="254" y="118" width="221" height="68" rx="13" fill="#121215" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <path d="M 265,134 L 268.5,130.5 L 270.5,132.2 L 274,128.5" stroke="#D4D4D8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <text x="278" y="134" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" font-weight="700">GOOG <tspan fill="#71717A" font-weight="500" font-size="7.5">1Y</tspan></text>
  <text x="464" y="134" text-anchor="end" fill="#E05252" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600">-17.21%</text>
  <text x="265" y="151" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700">$267.94</text>
  <text x="265" y="161" fill="#71717A" font-family="Segoe UI, system-ui, sans-serif" font-size="7">Alphabet Inc.</text>
  <path d="M 265,176 L 284,174 L 298,177 L 315,173 L 332,175 L 348,167 L 365,163 L 378,166 L 395,169 L 412,165 L 428,169 L 444,175 L 464,178" stroke="#E05252" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tile 4 (Bottom-Right): Weather -->
  <rect x="485" y="118" width="221" height="68" rx="13" fill="url(#weatherBg)" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <text x="496" y="133" fill="#E4E4E7" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" font-weight="600">Los Angeles</text>
  <path d="M 684,134 H 693 A 2.6,2.6 0 0 0 693.4,128.9 A 3.6,3.6 0 0 0 686.5,128 A 3,3 0 0 0 684,134 Z" stroke="#E4E4E7" stroke-width="1.2" fill="none"/>
  <text x="496" y="156" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="600">20°</text>
  <text x="530" y="146" fill="#D4D4D8" font-family="Segoe UI, system-ui, sans-serif" font-size="7">H 25° · T 11°</text>
  <text x="496" y="167" fill="#D4D4D8" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5">Cloudy</text>
  <text x="496" y="179" fill="#A1A1AA" font-family="Segoe UI, system-ui, sans-serif" font-size="7">Today <tspan fill="#E4E4E7">25°</tspan>   Thu <tspan fill="#E4E4E7">30°</tspan>   Fri <tspan fill="#E4E4E7">26°</tspan></text>

  <!-- Hero Title & Tagline -->
  <text x="480" y="252" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8">FreeNotch</text>
  <text x="480" y="280" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="500">Dynamic Island for Windows 11 · Local-First · Zero Telemetry</text>
  <text x="480" y="305" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5">2×2 Bento Dashboard · Synced Lyrics · Control Center · File Tray · Weather &amp; Finance</text>
</svg>
