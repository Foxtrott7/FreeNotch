name: Release Windows Notch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore WindowsNotch.csproj -r win-x64

      - name: Build release packages
        shell: pwsh
        run: |
          $ver = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($ver) -and '${{ github.ref_type }}' -eq 'tag') {
            $ver = '${{ github.ref_name }}'.TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($ver)) {
            ./scripts/publish-release.ps1
          } else {
            ./scripts/publish-release.ps1 -Version $ver
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/WindowsNotch-v*-win-x64-portable.zip
            publish/WindowsNotch-v*-win-x64-framework-dependent.zip
            publish/SHA256SUMS.txt
